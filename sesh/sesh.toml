# Machine-local sessions (e.g. the private ~/home_server repo symlinks its
# sessions file here). sesh PANICS if an import is missing, so the dotfiles
# setup (symlinks.sh) creates an empty ~/external/sesh.toml when there is none.
import = ["~/external/sesh.toml"]

[[session]]
name = "dotfiles"
path = "~/.dotfiles"
startup_command = "nvim ~/.dotfiles"

[[session]]
name = "interview_prep"
path = "~/interview_prep"
startup_command = "echo 'gl to me :)'"


[[session]]
name = "raycast"
path = "~/Documents/Raycast"

[[session]]
name = "BrowserCats"
path = "~"
startup_command = "terminal-browser open cats.com"

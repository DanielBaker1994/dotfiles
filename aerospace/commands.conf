# Workspace switcher command palette (loaded ONCE at daemon start).
# Format: name = shell command
# The command runs in a persistent bash (spawned at daemon start), so there's
# no per-invocation shell startup cost. Output is captured but not shown yet.
# A missing/broken config is not fatal — the app just shows no commands.
foo = echo "foo" > /tmp/out.txt
bar = echo bar
baz = echo baz

# Seamless Ctrl+h/j/k/l navigation between herdr panes and Vim/Neovim splits
# (vim-tmux-navigator, ported to herdr). Ctrl chords are bound to these actions
# in ~/.dotfiles/herdr/config.toml; each one forwards the key into the focused
# pane when Vim owns it, else moves herdr's pane focus.
# Adapted from paulbkim-dev/vim-herdr-navigation (MIT License).
id = "local.vim-nav"
name = "Vim navigation"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Ctrl+hjkl: move Vim splits, else move herdr panes"
platforms = ["linux", "macos"]

[[actions]]
id = "left"
title = "Navigate left (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "left"]

[[actions]]
id = "down"
title = "Navigate down (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "down"]

[[actions]]
id = "up"
title = "Navigate up (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "up"]

[[actions]]
id = "right"
title = "Navigate right (Vim/herdr)"
contexts = ["global"]
command = ["bash", "navigate.sh", "right"]

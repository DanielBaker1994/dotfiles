[package]
name = "ghostty-strip-bar"
version = "0.1.0"
edition = "2021"
description = "AeroSpace workspace bar: a tiny borderless panel pinned top-right of the Ghostty window"

[dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"
objc2-quartz-core = "0.3.2"
objc2-core-graphics = "0.3.2"

[profile.release]
opt-level = "s"
lto = true
strip = true

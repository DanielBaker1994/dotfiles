# SQL Workbench/J plain properties profile storage (Build 126+).
# This is the DOCUMENTED, manual-edit-friendly format (WbProfiles.xml is NOT
# meant to be hand-edited). Put this file in the SQL Workbench/J config dir.
#
# Fill in the Oracle values below to "plug and play". Keys per profile:
#   name, url, username, password, drivername, driverjar, driverclass,
#   autocommit, fetchsize
#
# Oracle JDBC URL forms (choose one):
#   jdbc:oracle:thin:@//HOST:PORT/SERVICE          (service name)
#   jdbc:oracle:thin:@HOST:PORT:SID                (SID)
#   jdbc:oracle:thin:@TNS_ALIAS                     (TNS name; needs oracle.net.tns_admin)

profile.oracledev.name=oracle-dev
profile.oracledev.driverclass=oracle.jdbc.OracleDriver
profile.oracledev.driverjar=/path/to/ojdbc8.jar
profile.oracledev.url=jdbc:oracle:thin:@//HOST:1521/SERVICE
profile.oracledev.username=YOUR_USERNAME
profile.oracledev.password=YOUR_PASSWORD
[package]
name = "herdr-pick"
version = "0.1.0"
edition = "2021"
description = "herdr prefix+w picker — Rust port of connect-herdr.sh + herdr-picker.mjs"
license = "MIT"

[[bin]]
name = "herdr-pick"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
libc = "0.2"

[profile.release]
opt-level = 2
lto = false
strip = true

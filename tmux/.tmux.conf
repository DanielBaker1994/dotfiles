set-option -g default-shell $SHELL
set-option -g detach-on-destroy off

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'

bind-key -T copy-mode-vi 'C-n' if -F '#{window_end_flag}' '' 'select-window -n'
bind-key -T copy-mode-vi 'C-p' if 'test #{window_index} -gt #{base-index}' 'select-window -p'

bind -n 'M-h' if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 5'
bind -n 'M-j' if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 5'
bind -n 'M-k' if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 5'
bind -n 'M-l' if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 5'

bind-key -T copy-mode-vi M-h resize-pane -L 5
bind-key -T copy-mode-vi M-j resize-pane -D 5
bind-key -T copy-mode-vi M-k resize-pane -U 5
bind-key -T copy-mode-vi M-l resize-pane -R 5

bind-key -T copy-mode-vi Space             send-keys -X begin-selection
bind-key -T copy-mode-vi v                 send-keys -X begin-selection
bind-key -T copy-mode-vi MouseDrag1Pane    select-pane \; send-keys -X begin-selection
bind-key -T copy-mode-vi C-v               send-keys -X rectangle-toggle
bind-key -T root C-s                     copy-mode \; send-keys -X begin-selection
bind-key -T root C-Space                copy-mode \; send-keys -X begin-selection
bind-key -T copy-mode-vi C-s               send-keys -X begin-selection
bind-key -T copy-mode-vi C-Space          send-keys -X begin-selection
bind-key -T copy-mode-vi C-y               send-keys -X copy-selection
bind-key -T copy-mode-vi y                 send-keys -X copy-selection-and-cancel

# Use vim-style keys in copy-mode and status
set -g mode-keys vi
set -g status-keys vi

bind-key -T choose C-n send-keys Down
bind-key -T choose C-p send-keys Up

# Ensure hjkl move cursor in copy-mode-vi
bind-key -T copy-mode-vi h                 send-keys -X cursor-left
bind-key -T copy-mode-vi j                 send-keys -X cursor-down
bind-key -T copy-mode-vi k                 send-keys -X cursor-up
bind-key -T copy-mode-vi l                 send-keys -X cursor-right

set -g base-index 1
set -g pane-base-index 1
set -g history-limit 100000
set -g renumber-windows on

# Catppuccin theme (via TPM), minimal: session + window names only.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @continuum-restore 'on'
set -g @catppuccin_flavour 'mocha'
# Status bar background matching the terminal (#1e1e2e).
set -g @catppuccin_status_background "#1e1e2e"
set -g @catppuccin_status_module_text_bg "#1e1e2e"
# Rounded window tabs (catppuccin's built-in style).
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_current_text "  #W  "
set -g @catppuccin_window_text "#W"

bind-key -T prefix w run-shell "$HOME/.dotfiles/sesh/connect.sh"

set -s escape-time 0

# Place status bar at the top
set -g status-position top
set -g default-terminal "tmux-256color"
# Forward cursor-shape changes from apps (Neovim guicursor) to the outer
# terminal: fat block in normal mode, thin bar in insert mode.
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -ag terminal-features ',*:RGB'
set -g set-clipboard on
set -g allow-passthrough on

set -g mouse on
set -g focus-events on

# Mouse wheel: 2 lines per tick (tmux default is 5 — too jumpy when combined
# with a terminal scroll multiplier like Ghostty's). Wheel over the status bar
# does nothing instead of silently switching windows.
bind-key -T copy-mode-vi WheelUpPane   select-pane \; send-keys -X -N 2 scroll-up
bind-key -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 2 scroll-down
unbind -T root WheelUpStatus
unbind -T root WheelDownStatus

set -g status-right-length 100
set -g status-left-length 100

# Ergonomic pane/window management
bind-key -T prefix '|' split-window -h -c "#{pane_current_path}"
bind-key -T prefix '-' split-window -v -c "#{pane_current_path}"
bind-key -T prefix 'c' new-window -c "#{pane_current_path}"
bind-key -T prefix '<' swap-window -t -1
bind-key -T prefix '>' swap-window -t +1

# Fuzzy-find any pane across all sessions and pull it into the current window
bind-key -T prefix 'j' run-shell "$HOME/.dotfiles/tmux/pane_grab.sh"

# Cycle the 5 built-in layouts: even-horizontal (| | | | columns),
# even-vertical (rows), main-horizontal (big top + small bottom row),
# main-vertical (big left + small right col), tiled (grid).
# Space = next, BSpace = previous; jump direct: :select-layout main-horizontal
bind-key -T prefix Space next-layout
bind-key -T prefix BSpace previous-layout

# Save current pane scrollback to a local temp file
bind-key -T prefix 'S' run-shell "f=/tmp/tmux-#{session_name}-#{window_index}-#{pane_index}.log; tmux capture-pane -JpS - > \"$f\"; tmux display-message \"Saved pane to $f\""

# tmux-fingers (via Homebrew): hint labels over file paths/URLs/SHAs, press a Bind: prefix + F.
run 'tmux-fingers load-config'

# Initialize TPM (keep at bottom of plugin section)
run '~/.tmux/plugins/tpm/tpm'

# Minimal status: session name on the left, nothing on the right.
# Window names use catppuccin's rounded tabs (configured above).
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right ""
# Force the status line background to #121212.
set -g status-style "bg=#121212,fg=#cdd6f4"

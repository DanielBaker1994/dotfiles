onboarding = false

[theme]
name = "tokyo-night"

auto_switch = false
[theme.custom]
sidebar_bg = "#121212"
panel_bg = "#1e1e2e"
text = "#cdd6f4"

[terminal]
default_shell = ""
new_cwd = "follow"

[keys]
# Pane focus with the prefix; direct ctrl+h/j/k/l live in the keys.command
# entries below (vim-aware: forwarded back into Vim when Vim owns the pane,
# else move focus — the herdr analogue of tmux.conf's is_vim bindings).
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
# right had no prefix chord (prefix+l is "last tab"); ctrl+l still navigates
focus_pane_right = ""

navigate_pane_left = "h"
navigate_pane_down = "j"
navigate_pane_up = "k"
navigate_pane_right = "l"

next_tab = "prefix+n"
previous_tab = "prefix+p"

new_tab = "prefix+c"

# jump to the last agent: prefix+a toggles to the previously focused agent
# pane, exactly like prefix+l does for tabs (plugin: ~/.dotfiles/herdr/plugins/last).
# sidebar cycling stays on prefix+shift+a.
next_agent = ""
previous_agent = "prefix+shift+a"

split_horizontal = "prefix+-"
split_vertical = "prefix+|"

# no Opt+H/J/K/L resize; resize = prefix+r
resize_pane_left = ""
resize_pane_down = ""
resize_pane_up = ""
resize_pane_right = ""

# Built-in workspace picker disabled; sesh picker takes its place via keys.command below
workspace_picker = ""

edit_scrollback = "prefix+e"

move_tab_previous = "prefix+<"
move_tab_next = "prefix+>"

# ctrl+h/j/k/l: vim-aware navigation (plugin: ~/.dotfiles/herdr/plugins/vim-nav).
# In a Vim/Neovim pane the chord is handed back to Vim — it moves its splits
# and, at a split edge, hands off to `herdr pane focus` itself (pane_nav in
# ~/.dotfiles/nvim/init.lua). Everywhere else the chord moves herdr's pane
# focus directly, so the keys work across shells, agent panes and Vim alike.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "local.vim-nav.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "local.vim-nav.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "local.vim-nav.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "local.vim-nav.right"
description = "navigate right (vim/herdr)"

[ui]
prompt_new_tab_name = false
tab_bar_position = "top"
mouse_capture = true
copy_on_select = true
pane_borders = "auto"
pane_outer_borders = true
pane_gaps = true
sidebar_width = 26
sidebar_start_collapsed = false

status_indicators = "symbols"
# blocked / done agents float to the top of the sidebar
agent_panel_sort = "priority"
# name the agent on each split's border
show_agent_labels_on_pane_borders = true
[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[advanced]
scrollback_limit_bytes = 50000000

# Sesh-style session picker (reads sesh.toml + zoxide + fd + browser + scratch)
[[keys.command]]
key = "prefix+w"
type = "popup"
command = "~/.dotfiles/sesh/connect-herdr.sh"
width = "90%"
height = "85%"

[experimental]
kitty_graphics = true

# tmux-style last jumps (plugin: ~/.dotfiles/herdr/plugins/last)
[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "local.last.workspace"
description = "last workspace"

# copy a path from the last output (plugin: ~/.dotfiles/herdr/plugins/copy-path)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "local.copy-path.open"
description = "copy path"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "local.last.tab"
description = "last tab"

# prefix+a: toggle to the previously focused agent pane (same shape as the
# last-tab jump above; the pane.focused event in the plugin keeps the pair)
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "local.last.agent"
description = "last agent"

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

# agent rows: $tab_name = the tab's label without the agent-tabs glyph prefix
# (plugin: ~/.dotfiles/herdr/plugins/agent-tabs); herdr's state_icon already
# shows the status



[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", "$tab_name"], ["agent"]]

# spaces: drop the git branch/status row, show just the space name
[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"]]

# copy-path settings (read on every prefix+f; no reload needed).
# Everything is decided from the pane's visible TEXT: the plugin never runs
# anything in the pane or on a remote host, so it works the same over ssh.

scope      = "output"  # "output" = rows between the last two prompts, "screen" = whole pane
timeout_ms = 5000      # close after this long without a key press
# Picking a hint copies and closes at once: no flash, no toast.

# --- prompt detection ---------------------------------------------------------
# A row matching prompt_regex is a prompt's INPUT row; the command is the text
# after the match. Covers: starship/pure/p10k "(INS) ❯ ls", bash "user@host:~/x$",
# zsh "user@host x %", fedora "[user@host x]$", fish "user@host ~/x>", dir-first
# "~/x $", Kali "└─$", Parrot "└──╼ $", macOS bash "host:x user$", robbyrussell
# "➜  x git:(main) ✗", "bash-5.2$"; any of them after a vi-mode "(INS) " / "(venv) ".
prompt_regex  = '❯ ?|^(?:\(\S+\) ?)*\[?[\w.-]+@[\w.-]+[: ] ?\S*\s?[$#%>]\]? ?|^(?:\(\S+\) ?)*[~/]\S*\s?[$#%>](?: |$)|^(?:\(\S+\) ?)*└─+(?:╼ )?[$#] ?|^(?:\(\S+\) ?)*[\w.-]+:\S+ [\w.-]+[$#](?: |$)|^(?:\(\S+\) ?)*➜\s+\S+(?: git:\(\S+\))?(?: ✗)?(?: |$)|^(?:\(\S+\) ?)*(?:ba|z|k|da)?sh-[\d.]+[$#](?: |$)'
# A bare "$" row (Git Bash's 2nd line) is a prompt only under a user@HOST header row.
bare_prompt_regex = '^(?:\(\S+\) ?)*[$#](?: |$)'
# Rows a multi-line prompt spans (starship = dir row + input row). Rows above
# are only read when the input row is just a symbol ("❯", "└─$", "$").
prompt_height = 2

# --- PS1 path building ----------------------------------------------------------
# true: copy full paths built from the dir shown in the prompt the command ran
# under ("./a" and "a" → "<dir>/a", "../a" normalised, /abs unchanged).
# Local pane (herdr checks the foreground process is not one of remote_commands):
#   ~ → $HOME; a prompt showing only part of the dir ("proj", starship's
#   repo-relative "proj/src", fish's "~/.d/x") or none ("bash-5.2$") → the
#   shell's cwd. Over ssh only the prompt's text counts: ~ stays ~ (root's → /root).
use_ps1 = true
# Dir in the input row's prompt; the first pattern with a (?P<dir>…) match wins.
ps1_dir_regex = [
    '^(?:\(\S+\) ?)*[\w.-]+:(?P<dir>\S+) [\w.-]+[$#]',             # macOS bash: host:dir user$
    ':(?P<dir>~[^\s$#%]*|/[^\s$#%]*)[$#%]',          # bash: user@host:~/dir$
    '[\w.-]+@[\w.-]+ (?P<dir>[^\s\]$#%>]+)\]?\s?[$#%>]',   # zsh/fish/fedora: user@host dir %
    '^(?:\(\S+\) ?)*➜\s+(?P<dir>\S+)',                       # oh-my-zsh robbyrussell
    '(?:^|[\s\[(])(?P<dir>~[^\s\])$#%>❯]*|/[^\s\])$#%>❯]*)',   # any ~/ or / word: "~/x ❯"
]
# Dir in the header row(s) above a symbol-only input row.
ps1_header_regex = [
    '[-─]\[(?P<dir>[^\]]+)\]\s*$',                   # Kali/Parrot: ┌──(u㉿h)-[~/x]
    '^\S+@\S+ (?:MINGW|MSYS|UCRT|CLANG)\S* (?P<dir>\S+)',   # Git Bash
    '^(?:.* in )?(?P<dir>[~/]\S*)',                  # starship/pure: "~/x via …", "root in host in ~"
    '^(?P<dir>[^\s/~]\S*)(?: (?:on|via|is|took)\s|$)',  # starship truncated: "a/proj on  main"
]
# Foreground commands that mean the pane is on another machine.
remote_commands = ["ssh", "mosh", "mosh-client", "autossh", "et", "telnet", "docker",
                   "podman", "kubectl", "lxc", "multipass", "vagrant", "tsh", "gcloud", "aws"]

# --- detection ------------------------------------------------------------------
# After these commands, every bare word in the output is a name (ls -l: the
# last column). Otherwise a word needs a "/" or an extension to count.
list_commands = ["ls", "ll", "la", "l", "eza", "exa", "lsd", "fd", "find"]
ignore_regex  = '^(\w+://|-|[\d.,:_/-]+$|[0-9a-f]{7,40}$)'  # URLs, flags, numbers, dates, SHAs
# Local panes only: a bare word that exists under the prompt's dir counts.
check_exists = false

alphabet = "asdfghjklwertyuiopzxcvbnm"   # hint letters, easiest first

[style]   # "#rrggbb" or a 0-255 color number
hint_fg   = "#1e1e2e"
hint_bg   = "#f9e2af"
match_fg  = "#f9e2af"
dim_fg    = "#6c7086"
status_fg = "#cdd6f4"
status_bg = "#313244"

# Proxmox hosts + guests: root over FIDO2 YubiKeys. Included from ~/.ssh/config.
# Managed by the proxmox-ssh Claude skill (~/.dotfiles/claude/skills/proxmox-ssh).
# Needs Homebrew ssh (/opt/homebrew/bin/ssh).
#
# Key choice is automatic: yk-select sees which YubiKey is plugged in, so ssh
# offers only that key (one passphrase, no failed attempt on the absent key).

# --- Guests on proxmoxmediaconnect (pve "mediaserver", 10.0.0.84) ---
Host notifications
  HostName 10.0.0.139
  User root
Host mealplanner
  HostName 10.0.0.206
  User root
Host media-vm
  HostName 10.0.0.247
  User root

# --- Guests on proxmoxpersonalconnect (pve, 10.0.0.226) ---
Host metube
  # LAN SSH blocked by its CT firewall (policy_in DROP); reachable over Tailscale only
  HostName 100.82.133.76
  User root
Host immich
  HostName 10.0.0.208
  User root

# --- Shared: reuse one authenticated connection for 10 min (connect.sh --long = 30) ---
Host 10.0.0.84 10.0.0.226 pve-226 *.ts.net 100.78.130.108 notifications mealplanner media-vm metube immich
  IdentitiesOnly yes
  ControlMaster auto
  ControlPath ~/.ssh/cm/%C
  ControlPersist 10m

# --- Pick the key for the YubiKey that is plugged in (root logins only) ---
Match user root host 10.0.0.84,10.0.0.226,pve-226,*.ts.net,100.78.130.108,10.0.0.139,10.0.0.206,10.0.0.247,100.82.133.76,10.0.0.208 exec "~/.dotfiles/ssh/yk-select k1"
  IdentityFile ~/.ssh/id_ed25519_sk_servers_k1
Match user root host 10.0.0.84,10.0.0.226,pve-226,*.ts.net,100.78.130.108,10.0.0.139,10.0.0.206,10.0.0.247,100.82.133.76,10.0.0.208 exec "~/.dotfiles/ssh/yk-select k2"
  IdentityFile ~/.ssh/id_ed25519_sk_servers_k2
Match user root host 10.0.0.84,10.0.0.226,pve-226,*.ts.net,100.78.130.108,10.0.0.139,10.0.0.206,10.0.0.247,100.82.133.76,10.0.0.208 exec "~/.dotfiles/ssh/yk-select any"
  IdentityFile ~/.ssh/id_ed25519_sk_servers_k1
  IdentityFile ~/.ssh/id_ed25519_sk_servers_k2

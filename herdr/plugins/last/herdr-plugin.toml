# tmux-style "last" jumps: records focus history from herdr events.
#   (the "Last workspace" action has no key; run it from the action palette)
#   sidebar spaces float to the top when you change something in them (pane/tab
#   created, closed, split, moved, tab renamed) - merely switching does not
#   prefix+l → last tab in this workspace (tmux: last window)
#   agent pair → read by prefix+a (herdr-pick agents) to start on the last agent;
#                the "Last agent" action has no key (action palette)
id = "local.last"
name = "Last workspace / tab / agent"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Jump to the previously focused workspace, tab, or agent pane"
platforms = ["linux", "macos"]

[[startup]]
command = ["./last.sh", "record"]

# tab.focused also fires on workspace switches, so it records both ids.
[[events]]
on = "tab.focused"
command = ["./last.sh", "record"]

# pane.focused fires when the focused pane changes (even inside a tab);
# the handler stores the pane when it hosts an agent, for prefix+a.
[[events]]
on = "pane.focused"
command = ["./last.sh", "agent-record"]

# interaction = changing a space; each of these moves it to the top of the sidebar
[[events]]
on = "pane.created"
command = ["./last.sh", "touch"]

[[events]]
on = "pane.split"
command = ["./last.sh", "touch"]

[[events]]
on = "pane.closed"
command = ["./last.sh", "touch"]

[[events]]
on = "pane.moved"
command = ["./last.sh", "touch"]

[[events]]
on = "tab.created"
command = ["./last.sh", "touch"]

[[events]]
on = "tab.closed"
command = ["./last.sh", "touch"]

[[events]]
on = "tab.renamed"
command = ["./last.sh", "touch"]

[[actions]]
id = "workspace"
title = "Last workspace"
command = ["./last.sh", "workspace"]

[[actions]]
id = "tab"
title = "Last tab"
command = ["./last.sh", "tab"]

[[actions]]
id = "agent"
title = "Last agent"
command = ["./last.sh", "agent"]
